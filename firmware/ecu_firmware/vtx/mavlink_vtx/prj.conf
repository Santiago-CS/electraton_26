CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y

# BEGIN AUTO-ADDED BY MCUXPRESSO EXTENSION
CONFIG_MCUX_COMPONENT_driver.lptmr=y
# END AUTO-ADDED BY MCUXPRESSO EXTENSION

# BEGIN AUTO-ADDED BY MCUXPRESSO EXTENSION
CONFIG_MCUX_COMPONENT_driver.edma_soc=y
CONFIG_MCUX_COMPONENT_driver.edma4=y
CONFIG_MCUX_COMPONENT_driver.lpuart_edma=y
# END AUTO-ADDED BY MCUXPRESSO EXTENSION

# BEGIN AUTO-ADDED BY MCUXPRESSO EXTENSION
CONFIG_SPI_RETRY_TIMES=0
CONFIG_MCUX_COMPONENT_driver.lpspi_edma=y
CONFIG_MCUX_COMPONENT_driver.lpspi=y
# END AUTO-ADDED BY MCUXPRESSO EXTENSION

CONFIG_MCUX_COMPONENT_driver.lpi2c_edma=y
CONFIG_MCUX_COMPONENT_driver.lpi2c=y

# RPMsg to Linux: motor controller telemetry decoded from can0 by the
# vtx/can2m33 daemon arrives here (comms/pmac_link.c). Same components as the
# SDK's i.MX93 rpmsg_lite_str_echo_rtos example; no queue, the endpoint
# callback does the work. MCMGR is not used with a Linux master.
CONFIG_MCUX_COMPONENT_middleware.multicore.rpmsg-lite=y
CONFIG_MCUX_COMPONENT_middleware.multicore.rpmsg-lite.ns=y
CONFIG_MCUX_COMPONENT_middleware.multicore.rpmsg-lite.freertos=y
CONFIG_MCUX_COMPONENT_middleware.multicore.remoteproc=y
CONFIG_MCUX_COMPONENT_middleware.multicore.mcmgr=n

# rpmsg-lite allocates its instance and both virtqueues (256 entries each)
# from the FreeRTOS heap; 10 KB was only ever sized for the task stacks.
CONFIG_configTOTAL_HEAP_SIZE=32768
